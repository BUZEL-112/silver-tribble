name: Production Deployment Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-backend:
    name: Build and Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ai-video-repo/ai-video-pipeline:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ai-video-repo/ai-video-pipeline:${{ github.sha }}"
          gcloud run deploy ai-video-pipeline \
            --image="$IMAGE_TAG" \
            --region=us-central1 \
            --platform=managed \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=2 \
            --memory=2Gi \
            --timeout=900 \
            --no-cpu-throttling \
            --update-env-vars="API_AUTH_TOKEN=${{ secrets.API_AUTH_TOKEN }},DATABASE_URL=${{ secrets.DATABASE_URL }}"

  deploy-frontend:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
