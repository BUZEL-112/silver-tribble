# ==============================================================================
# AI News to YouTube Video Generation Pipeline - Configuration Template
# ==============================================================================
# To configure your project:
#   1. Copy this template to config.yaml:
#        cp config_example.yaml config.yaml
#   2. Edit config.yaml and fill in your preferred models, keys, and paths.
#
# Loading Precedence:
#   CLI flags (highest) > Environment Variables > config.yaml > .env > Default Settings
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Database Configuration
# ------------------------------------------------------------------------------
database:
  # SQLite (default for local development):
  url: "sqlite:///./data/ai_news.db"

  # PostgreSQL (for production with pgvector / docker-compose):
  # url: "postgresql://postgres:postgres@localhost:5432/ai_news_video"

# ------------------------------------------------------------------------------
# 2. LiteLLM Proxy / Gateway Settings (Optional)
# ------------------------------------------------------------------------------
# LiteLLM proxy is 100% optional. If you supply direct provider keys in
# Section 4 (providers.openai_api_key, deepseek_api_key, etc.), the pipeline
# connects directly to the providers without LiteLLM or config/litellm_config.yaml.
#
# If running the docker-compose LiteLLM proxy or an external gateway (e.g. OpenRouter):
litellm:
  base_url: "http://localhost:4000"
  api_key: "sk-litellm-master-key"

# ------------------------------------------------------------------------------
# 3. Model Registry & Role Mappings (Decoupled Provider Endpoints & Fallback Chains)
# ------------------------------------------------------------------------------
# Define custom model endpoints in model_registry and map them to pipeline roles.
# Each role accepts an ordered list of model names. The first entry is tried first;
# if it fails, the pipeline automatically falls back to the next model in the list.
#
# Supported endpoint_type: "chat", "embedding", "multimodal"
# Supported api_format: "openai", "anthropic"

model_registry:
  - name: "gemini-flash"
    model_name: "gemini-3.5-flash-lite"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: null      # Defaults to providers.gemini_api_key if omitted
    api_format: "openai"
    endpoint_type: "chat"
    timeout: 30.0

  - name: "deepseek-cloud"
    model_name: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key: null      # Defaults to providers.deepseek_api_key if omitted
    api_format: "openai"
    endpoint_type: "chat"
    timeout: 30.0

  - name: "gpt-mini"
    model_name: "gpt-4o-mini"
    base_url: "https://api.openai.com/v1"
    api_key: null      # Defaults to providers.openai_api_key if omitted
    api_format: "openai"
    endpoint_type: "chat"
    timeout: 30.0

  - name: "gemini-embed"
    model_name: "gemini-embedding-2"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: null
    api_format: "openai"
    endpoint_type: "embedding"
    timeout: 30.0

  - name: "local-embed"
    model_name: "local:BAAI/bge-small-en-v1.5"
    base_url: null
    api_key: null
    api_format: "openai"
    endpoint_type: "embedding"
    timeout: 30.0

  - name: "gemini-vlm"
    model_name: "gemini-3.5-flash-lite"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key: null
    api_format: "openai"
    endpoint_type: "multimodal"
    timeout: 30.0

roles:
  # Stage 1: Narrative beat sheet structuring (ScriptService.generate_beat_sheet)
  planning:
    - "gemini-flash"
    - "gpt-mini"
    - "deepseek-cloud"

  # Stage 2: Host persona dialogue expansion (ScriptService.expand_script_persona)
  writing:
    - "gemini-flash"
    - "deepseek-cloud"
    - "gpt-mini"

  # Semantic story clustering embeddings (ClusteringService.generate_embeddings_for_new_articles)
  embedding:
    - "gemini-embed"
    - "local-embed"

  # Multimodal Visual Asset Inspector (MediaInspector.inspect_candidate)
  vlm_inspector:
    - "gemini-vlm"

# Legacy scalar model configuration (still supported for backwards compatibility):
models:
  # Stage 1: Narrative beat sheet structuring (fast, structured output model)
  planning: "gemini-flash"

  # Stage 2: Comedic host persona dialogue expansion (creative, expressive writer)
  writing: "gemini-flash"

  # Semantic story clustering vector embedding model:
  embedding: "gemini-embed"

  # Custom embedding endpoint (e.g. Ollama http://localhost:11434/v1 or Voyage AI):
  embedding_base_url: null
  embedding_api_key: null

# ------------------------------------------------------------------------------
# 4. Direct Provider API Keys (Bring Your Own Key - BYOK)
# ------------------------------------------------------------------------------
# Configure direct provider keys if you are not routing via LiteLLM:
providers:
  # OpenAI API key (for gpt-4o-mini / text-embedding-3-small)
  openai_api_key: null      # "sk-proj-..."

  # DeepSeek API key (for deepseek-chat persona dialogue)
  deepseek_api_key: null    # "sk-..."

  # Google AI Studio / Gemini API key (for gemini models & text-embedding-004)
  gemini_api_key: null      # "AIzaSy..."

  # Pexels API key (for stock B-roll background footage)
  pexels_api_key: null      # "..."

  # Giphy API key (for reaction meme GIFs)
  giphy_api_key: null       # "..."

# ------------------------------------------------------------------------------
# 5. Text-to-Speech (TTS) Voice Synthesis
# ------------------------------------------------------------------------------
# Voice synthesis provider options:
#   - "local"    : Local endpoint TTS provider (Kokoro, Piper, or local HTTP server)
#   - "gemini"   : Google Gemini 2.0 Flash Audio synthesis
#   - "edge_tts" : Microsoft Edge neural TTS (free cloud service)
#   - "auto"     : Priority routing (gemini -> edge_tts -> local)
tts:
  provider: "auto"
  # Endpoint URL for local HTTP audio server (e.g. Kokoro-FastAPI, Piper HTTP, Speaches)
  endpoint: "http://localhost:8880/v1/audio/speech"
  # Local filesystem path to TTS model weights, ONNX file, or binary (e.g. Piper model)
  path: ""
  # Local model name (e.g. "kokoro", "piper")
  model: "kokoro"
  # Default voice identifier (e.g. "af_heart", "en_US-lessac-medium")
  voice: "af_heart"
  # Request timeout in seconds
  timeout: 60.0

# ------------------------------------------------------------------------------
# 6. Asset & Media Storage
# ------------------------------------------------------------------------------
storage:
  # Storage backend: "local" or "s3" (Cloudflare R2 / AWS S3)
  backend: "local"

  # Local directory for media assets when backend is "local"
  local_dir: "./data/assets"

  # Cloudflare R2 / S3 Configuration (only required if backend: "s3")
  r2:
    account_id: null
    access_key_id: null
    secret_access_key: null
    bucket_name: null
    public_url: null

# ------------------------------------------------------------------------------
# 6. Audio Transcription & Word Caption Alignment (faster-whisper)
# ------------------------------------------------------------------------------
whisper:
  # Whisper model size: "tiny", "base", "small", "medium"
  model_size: "base"

  # Inference device: "cpu" or "cuda"
  device: "cpu"

# ------------------------------------------------------------------------------
# 7. Remotion Motion Graphics & Video Rendering Engine
# ------------------------------------------------------------------------------
remotion:
  # Root directory of the Remotion project
  project_dir: "./remotion"

  # Target export folder for rendered MP4 video files
  output_dir: "./output/videos"

# ------------------------------------------------------------------------------
# 8. Story Clustering & Semantic Similarity Hyperparameters
# ------------------------------------------------------------------------------
clustering:
  # Cosine similarity cutoff (0.0 to 1.0) for grouping news articles
  # Lower (e.g. 0.75) creates broader, larger clusters
  # Higher (e.g. 0.88) creates tighter, more specific topic clusters
  similarity_threshold: 0.82

# ------------------------------------------------------------------------------
# 9. Media & Stock Visual Retrieval (Pexels & Giphy)
# ------------------------------------------------------------------------------
media:
  # Local cache directory for downloaded videos, images, and GIFs
  cache_dir: "./artifacts/media"

  # Visual asset inspector mode:
  # - "off": automated fast retrieval with deduplication and domain queries
  # - "multimodal": VLM (Gemini) evaluates image relevance to narration
  # - "hil": human-in-the-loop interactive review and selection
  inspector_mode: "off"

  # Model used when inspector_mode is "multimodal"
  multimodal_model: "gemini-2.0-flash"

  # Minimum relevance score threshold (1 to 10) for candidate approval
  min_relevance_score: 7.0

# ------------------------------------------------------------------------------
# 10. Watermark & Branding Overlays
# ------------------------------------------------------------------------------
watermark:
  # Top header channel badge text (displayed on the main title card)
  # You can customize this string freely (e.g. "AI NEWS BY ESWAR", "TECH PULSE DAILY")
  header_badge: "AI NEWS BY ESWAR"

  # On-screen text identifier / watermark (displayed top-right, e.g. "@AINewsDesk")
  text: "@AINewsDesk"

  # Path to transparent PNG/SVG logo overlay file (optional)
  image_path: null

  # Screen position: "top-right", "top-left", "bottom-right", "bottom-left"
  position: "top-right"

  # Watermark opacity (0.0 = invisible, 1.0 = fully opaque)
  opacity: 0.8

# ------------------------------------------------------------------------------
# 11. Timeline Delays & Card Timing Offsets
# ------------------------------------------------------------------------------
timing:
  # Intro delay in seconds (duration watermark/title displays before speech begins)
  intro_delay_seconds: 1.5

  # Outro card duration in seconds (duration card displays after narration ends)
  outro_duration_seconds: 3.0

# ------------------------------------------------------------------------------
# 12. System Prompts Configuration
# ------------------------------------------------------------------------------
# Customize system prompts for every model interaction point.
# You can reference a YAML/TXT template file, or provide an inline `system_prompt` override.
prompts:
  # Stage 1: News beat sheet structuring
  planning:
    file: "prompts/beat_sheet.yaml"
    # Optional inline system prompt override:
    # system_prompt: |
    #   You are an executive news producer structuring fast-paced tech news...

  # Stage 2: Scriptwriting and host persona
  writing:
    file: "prompts/eswar_host_persona.yaml"
    # Optional inline system prompt override:
    # system_prompt: |
    #   You are 'Eswar', a sharp, technically literate AI news commentator...

  # Media Inspection: Multimodal VLM quality evaluation
  media_inspector:
    file: "prompts/media_inspector.yaml"
    # Optional inline system prompt override:
    # system_prompt: |
    #   You are a strict visual quality inspector evaluating AI news b-roll...

# ------------------------------------------------------------------------------
# 13. Curated AI News RSS Feeds
# ------------------------------------------------------------------------------
# List of RSS feeds to scrape during the `ingest` pipeline stage.
# You can add any custom RSS/Atom feeds here as objects with name and url,
# or simply as raw URL strings:
rss_feeds:
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
  - name: "VentureBeat AI"
    url: "https://venturebeat.com/category/ai/feed/"
  - name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - name: "MIT Technology Review AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
  - name: "ArXiv AI Recent"
    url: "https://rss.arxiv.org/rss/cs.AI"
  - name: "Hacker News AI"
    url: "https://hnrss.org/newest?q=AI"
  - name: "Hacker News Frontpage"
    url: "https://news.ycombinator.com/rss"
