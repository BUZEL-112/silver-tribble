# ==============================================================================
# LiteLLM Proxy Configuration (Optional)
# ==============================================================================
# NOTE: This file is ONLY required if you run the LiteLLM Docker container via
# docker-compose. For standard CLI, web dashboard, and script execution, you can
# configure your API keys directly in config.yaml (providers section) or .env,
# making this file and the LiteLLM container completely redundant.
# ==============================================================================

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30

  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 45

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      timeout: 20

router_settings:
  fallbacks:
    - gpt-4o-mini: ["deepseek-chat"]
  num_retries: 2
  retry_after: 2
  timeout: 40

general_settings:
  master_key: "sk-litellm-master-key"
