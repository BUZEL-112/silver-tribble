name: Production Deployment Pipeline

on:
  push:
    branches:
      - master
      - main

jobs:
  check-credentials:
    name: Check GCP Credentials
    runs-on: ubuntu-latest
    outputs:
      has_gcp_key: ${{ steps.check.outputs.has_gcp_key }}
    steps:
      - name: Validate GCP credentials availability
        id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_gcp_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gcp_key=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: Build and Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    needs: check-credentials
    if: needs.check-credentials.outputs.has_gcp_key == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/newsroom-ai-repo/newsroom_ai:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/newsroom-ai-repo/newsroom_ai:${{ github.sha }}"
          gcloud run deploy newsroom-ai \
            --image="$IMAGE_TAG" \
            --region=us-central1 \
            --platform=managed \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=2 \
            --memory=2Gi \
            --timeout=900 \
            --no-cpu-throttling \
            --update-env-vars="API_AUTH_TOKEN=${{ secrets.API_AUTH_TOKEN }},DATABASE_URL=${{ secrets.DATABASE_URL }}"

  deploy-frontend:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: [check-credentials, deploy-backend]
    if: always() && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
