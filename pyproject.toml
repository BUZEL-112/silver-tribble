[project]
name = "ai-news-video-pipeline"
version = "0.1.0"
description = "Automated AI news to YouTube video pipeline with Prefect, LiteLLM, and Remotion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eswar" }
]
dependencies = [
    "prefect>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "feedparser>=6.0.11",
    "openai>=1.30.0",
    "google-genai>=0.1.1",
    "faster-whisper>=1.0.0",
    "boto3>=1.34.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-boto3>=1.34.0",
]

[project.scripts]
pipeline = "src.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
