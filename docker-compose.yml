services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_video_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_news_video}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_news_video}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_video_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_news_video}
      APP_CONFIG_FILE: /data/config.yaml
      DATA_DIR: /data
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    volumes:
      - app_data:/data
      - ./config.yaml:/data/config.yaml
      - ./output:/app/output
      - ./prompts:/app/prompts:ro
      - ./src:/app/src
    ports:
      - "0.0.0.0:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # caddy service disabled to allow direct access to app on port 8000
  # caddy:
