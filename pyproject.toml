[project]
name = "newsroom_ai"
version = "0.1.0"
description = "Newsroom AI: Autonomous AI news to video production pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eswar" }
]
dependencies = [
    "prefect>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "feedparser>=6.0.11",
    "openai>=1.30.0",
    "google-genai>=0.1.1",
    "faster-whisper>=1.0.0",
    "boto3>=1.34.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastembed>=0.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "edge-tts>=7.2.8",
    "python-multipart>=0.0.9",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "video", "pipeline", "newsroom", "cli", "remotion", "tts", "gemini"]

[project.urls]
Homepage = "https://github.com/BUZEL-112/silver-tribble"
Repository = "https://github.com/BUZEL-112/silver-tribble"
Issues = "https://github.com/BUZEL-112/silver-tribble/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-boto3>=1.34.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
newsroom_ai = "src.cli:app"
newsroom = "src.cli:app"
newsroom-ai = "src.cli:app"
pipeline = "src.cli:app"
ai-video = "src.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["templates/*", "static/*", "prompts/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast isolated unit tests with no external dependencies",
    "integration: tests that exercise multiple layers or HTTP endpoints",
    "e2e: full end-to-end pipeline tests requiring all services",
    "manual: Playwright browser tests that require a running web server",
    "postgres: tests that require a live PostgreSQL connection",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
